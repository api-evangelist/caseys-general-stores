description: 'Casey''s General Stores (NASDAQ: CASY) is one of the largest convenience-store chains in
  the United States, operating more than 2,900 stores selling fuel, made-from-scratch pizza, prepared
  food and convenience items, primarily in small midwestern communities. Behind the consumer brand Casey''s
  runs a B2B API estate on Azure API Management at esl.caseys.io: 21 published OpenAPI 3.0.1 contracts
  and 158 operations covering stores and the division/region/district hierarchy, the Item Master (Pricebook),
  fuel pricing, per-store tax configuration, fuel tank telemetry, suppliers, vendor check-in, kitchen
  production planning, shelf-label printing, in-store messaging and IT service-management incidents —
  plus Conexxus POS Back Office Interface document ingestion carrying Conexxus Open Retailing identifiers.
  Access is by Azure APIM subscription key requested through the developer portal at developer.esl.caseys.io;
  a UAT environment mirrors the estate. No pricing, rate limits, SDKs, status page, changelog, deprecation
  policy or MCP server are published.'
