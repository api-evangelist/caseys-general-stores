summary: Casey's exposes 21 REST APIs and 8 GraphQL endpoints through one Azure API Management gateway
  at esl.caseys.io. Every call is authorised by an APIM subscription key. The estate is read-heavy; the
  write surface is POS document ingestion, ITSM incidents, tank-level readings, store messaging and store-agent
  registration.
authentication:
  style: api_key
  header: Ocp-Apim-Subscription-Key
  query_alternative: subscription-key
  note: 'Azure API Management subscription key, one product per API (23 products published, all with subscriptionRequired:
    true and approvalRequired: false). A key is requested per API from the developer portal.'
  see: authentication/caseys-general-stores-authentication.yml
