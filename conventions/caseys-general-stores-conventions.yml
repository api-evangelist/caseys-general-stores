  note: Zero matches for "idempoten" across all 21 OpenAPI documents. None of the 14 genuinely mutating
    operations declares an Idempotency-Key header or any replay-protection mechanism.
  agent_risk: A retry after a timeout on POST /journal, POST /report or POST /v1/tanklevel/addlevels can
    duplicate a POS journal document or a tank reading; POST /v1/incidents can open a duplicate ITSM incident.
    There is no documented safe replay primitive on any write in this estate.
reversibility:
  grade: none
  write_operations: 14
  reversal_operations: []
  note: No cancel, void, refund, reverse, undo, rollback, restore or delete operation exists anywhere
    in the 158 published operations — the estate declares 134 GET, 23 POST and 1 PUT, and not a single
    DELETE. POST /journal/reconciliation on CasGatewayApi is a reconciliation submission, not a reversal,
    and the contract does not describe it as one. Nothing states a correction window for a submitted POS
    document, an added tank level, or a created incident.
  not_asserted: No reversal window is claimed here because Casey's publishes none. An integrator must
    treat every write in this estate as final.
  write_operations_note: 24 POST/PUT operations are declared, but 8 of them are the GraphQL endpoints
