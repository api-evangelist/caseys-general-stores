  - offset
  also_seen:
  - Limit
  - Offset
  operations: 24
  response_fields: tankLevelGetEndpointPaginatedResultsV1 is the only schema that names itself paginated;
    the store reads return bare arrays with no total/next envelope.
  note: Casing is inconsistent across the estate — StoreApi/OldStoreApi use limit/offset, TankLevelApi
    and ItemApi use Limit/Offset. A client cannot use one pagination helper across the gateway.
