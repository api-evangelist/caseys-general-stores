summary: 'The estate is organised around one primary key: storeNumber. It appears as a path parameter,
  a query parameter or a body field on 24 operations across 9 of the 21 APIs, and it is the join key between
  the store hierarchy, item/pricebook data, fuel pricing, tax configuration, tank telemetry, supplier
  lists and POS documents. The organizational hierarchy (division -> region -> district -> store) is the
  second backbone.'
