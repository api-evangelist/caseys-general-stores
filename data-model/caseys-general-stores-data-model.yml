cross_api_note: storeNumber is a genuine cross-API foreign key but is typed inconsistently — integer in
  FuelPriceApi (storeId), path string in TaxApi and StoreMessagingApi, and both integer and string in
  the store APIs. There is no shared components library across the 21 documents; StoreApi and OldStoreApi
  duplicate 46 identical schemas.
