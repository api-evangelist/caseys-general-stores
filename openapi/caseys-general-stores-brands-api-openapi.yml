openapi: 3.2.0
info:
  title: Caseys General Stores Brands API
  version: '1.0'
  description: 'Operations tagged brands across 3 of this provider''s published API definitions: caseys-general-stores-old-store-api-openapi.json, caseys-general-stores-store-api-openapi.json, caseys-general-stores-store-details-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://esl.caseys.io/oldstoreapi
- url: https://esl.caseys.io/storeapi
- url: https://esl.caseys.io/storedetailsapi
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: Brands
paths:
  /v1/brands:
    get:
      tags:
      - Brands
      summary: v1 Gets a list of store branding styles
      description: Gets a list of the branding styles available for stores.
      operationId: getBrandsV1
      responses:
        '200':
          description: This resource represents a list of branding styles for stores.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/brandModelV1'
              example:
              - '{"id":1,"name":"Casey''s"}'
        '500':
          description: An error occurred while processing the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
              example:
                code: 0
                message: string
    servers:
    - url: https://esl.caseys.io/oldstoreapi
  /brands:
    get:
      tags:
      - Brands
      summary: v0 Gets a list of store branding styles [DEPRECATED]
      description: Gets a list of the branding styles available for stores.
      operationId: getBrandsV0
      responses:
        '200':
          description: This resource represents a list of branding styles for stores.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/brandModelV0'
              example:
              - '{"id":1,"name":"Casey''s"}'
        '500':
          description: An error occurred while processing the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
              example:
                code: 0
                message: string
    servers:
    - url: https://esl.caseys.io/oldstoreapi
components:
  schemas:
    brandModelV0:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier for the brand.
          format: int32
        name:
          type: string
          description: The name of the brand.
      example: '{"id":1,"name":"Casey''s"}'
    brandModelV1:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier for the brand.
          format: int32
        name:
          type: string
          description: The name of the brand.
      example: '{"id":1,"name":"Casey''s"}'
    apiError:
      type: object
      properties:
        code:
          type: integer
          description: Status code of the error.
          format: int32
        message:
          type: string
          description: Message that describes the error.
    brandModelV0_2:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier for the brand.
          format: int32
        name:
          type: string
          description: The name of the brand.
      example:
        id: 1
        name: Casey's
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
x-refined-from:
- caseys-general-stores-old-store-api-openapi.json
- caseys-general-stores-store-api-openapi.json
- caseys-general-stores-store-details-api-openapi.json
