openapi: 3.2.0
info:
  title: Caseys General Stores organization hierarchy API
  version: '1.0'
  description: 'Operations tagged organization hierarchy across 2 of this provider''s published API definitions: caseys-general-stores-old-store-api-openapi.json, caseys-general-stores-store-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://esl.caseys.io/oldstoreapi
- url: https://esl.caseys.io/storeapi
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: organization hierarchy
paths:
  /v1/organizational/districts/{districtId}:
    get:
      tags:
      - organization hierarchy
      summary: v1 Gets a district's data
      description: Gets the data for a specific district in the organizational hierarchy.
      operationId: getDistrictByIdV1
      parameters:
      - name: districtId
        in: path
        description: The unique identifier of the district to get information for.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: This resource represents a district in the organizational hierarchy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/districtModelV1'
              example:
                id: 13
                name: District 13
                _links:
                  parent:
                    href: /v1/organizational/regions/13
                  children:
                  - href: /v1/store/1906
                  - href: /v1/store/1930
                  - href: /v1/store/1954
                  - href: /v1/store/1957
                  - href: /v1/store/1958
                  - href: /v1/store/2291
                  - href: /v1/store/2295
                  - href: /v1/store/2945
                  - href: /v1/store/2959
                  - href: /v1/store/2984
                  - href: /v1/store/3842
                  - href: /v1/store/3894
                  - href: /v1/store/2951
        '404':
          description: No resource was found for the given identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
              example:
                code: 0
                message: string
        '500':
          description: An error occurred while processing the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiError'
              example:
                code: 0
                message: string
    servers:
    - url: https://esl.caseys.io/oldstoreapi
