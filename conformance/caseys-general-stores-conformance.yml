summary: Casey's B2B API estate runs on Azure API Management at esl.caseys.io. The contracts declare the
  Conexxus POS Back Office Interface / POS Activity Reporting API standard by name and carry Conexxus
  Open Retailing correlation headers, which is the domain standard for the convenience-store and fuel-retail
  market. No OAuth2/OIDC, FAPI, SCIM or OData surface exists — authentication is an APIM subscription
  key.
